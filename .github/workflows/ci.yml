name: Medical RAG CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # JOB 1: Test the Backend
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Rag_A_B_Testing/backend

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'
        cache-dependency-path: Rag_A_B_Testing/backend/requirements.txt

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # 1. Install CPU-only PyTorch first (lightweight)
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        # 2. Install the rest (ignoring the torch line in requirements.txt if it conflicts)
        pip install -r requirements.txt
        pip install pytest

    - name: Run Unit Tests
      run: |
        # Run pytest on our new test file
        pytest tests/test_security.py

  # JOB 2: Test the Frontend Build
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Rag_A_B_Testing/frontend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: Rag_A_B_Testing/frontend/package-lock.json

    - name: Install Dependencies
      run: npm ci

    - name: Verify Build
      run: npm run build