version: '3.8'

services:
  backend:
    build: ./backend
    container_name: medical-rag-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env 
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    
    
    # This syncs the container folder with your local folder.
    # When the app saves the JSONL file, it will appear on your Mac.
    volumes:
      - ./backend:/app
      # Exclude these to prevent conflicts between Mac/Linux binaries
      - /app/venv
      - /app/__pycache__

  frontend:
    build: ./frontend
    container_name: medical-rag-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend